{%- assign total = 0 -%}
        <div class="groups">
{%- for group in site.data.workflows %}
            <div class="group">
              <h3>{{ group.area }} <span class="count">{{ group.items.size | prepend: "0" | slice: -2, 2 }}</span></h3>
              <ul>
{%- for item in group.items %}
                <li><strong>{{ item.name }}</strong><span>{{ item.does }}</span></li>
{%- endfor %}
              </ul>
            </div>
{%- endfor %}
        </div>
