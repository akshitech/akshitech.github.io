  <footer class="foot">
    <div class="wrap">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.data.contact.legal_name }}{% if site.data.contact.cin != "" %}. CIN {{ site.data.contact.cin }}{% endif %}</span>
      <nav aria-label="Footer">
{%- for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
{%- endfor %}
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </footer>
