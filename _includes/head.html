  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/og-image.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.share_description | default: page.description }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
{%- if page.url == "/" %}
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "Organization",
   "name": "Akshi", "legalName": {{ site.data.contact.legal_name | jsonify }},
   "url": {{ "/" | absolute_url | jsonify }}, "logo": {{ "/apple-touch-icon.png" | absolute_url | jsonify }},
   "description": {{ page.description | jsonify }},
   "email": {{ site.data.contact.email | jsonify }}, "telephone": {{ site.data.contact.phone | jsonify }},
   "areaServed": "IN"}
  </script>
{%- endif %}
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-sans-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/newsreader-500-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-mono-500-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-mono-400-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>document.documentElement.classList.add("js")</script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
